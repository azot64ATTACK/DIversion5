name: Build VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target DiversionSynth_VST3
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: DIVERSION-VST3
          path: build/DiversionSynth_artefacts/Release/VST3
